<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake & Ladder</title>

<style>

body{
margin:0;
background:#222;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
display:flex;
gap:20px;
}

#board{
display:grid;
grid-template-columns:repeat(10,60px);
grid-template-rows:repeat(10,60px);
border:4px solid white;
}

.cell{
width:60px;
height:60px;
display:flex;
justify-content:center;
align-items:center;
font-size:14px;
font-weight:bold;
border:1px solid rgba(255,255,255,.2);
position:relative;
}

.even{
background:#90caf9;
}

.odd{
background:#ffe082;
}

.player1,
.player2{

position:absolute;

width:18px;
height:18px;

border-radius:50%;

}

.player1{

background:red;
left:6px;
bottom:6px;

}

.player2{

background:blue;
right:6px;
top:6px;

}

.panel{

width:260px;

}

button{

width:100%;
padding:12px;
font-size:18px;
margin-top:10px;
cursor:pointer;

}

#status{

margin-top:20px;
font-size:20px;

}

#dice{

margin-top:20px;

font-size:60px;

text-align:center;

}

</style>

</head>

<body>

<div class="container">

<div id="board"></div>

<div class="panel">

<h2>Snake & Ladder</h2>

<select id="mode">

<option value="ai">Player vs AI</option>

<option value="2">Two Players</option>

</select>

<button id="roll">Roll Dice</button>

<div id="dice">🎲</div>

<div id="status">
Player 1 Turn
</div>

</div>

</div>

<script>

const board=document.getElementById("board");

for(let r=9;r>=0;r--){

let cols=[];

for(let c=0;c<10;c++){

cols.push(r*10+c+1);

}

if((9-r)%2==1)
cols.reverse();

cols.forEach(num=>{

let d=document.createElement("div");

d.className="cell "+(num%2==0?"even":"odd");

d.id="cell"+num;

d.innerHTML=num;

board.appendChild(d);

});

}

</script>

</body>
</html>
