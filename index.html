<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Last Stand: Earth</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="loading">

<h1>LAST STAND</h1>

<p>EARTH</p>

<button id="startButton">START GAME</button>

</div>

<div id="hud">

<div class="box">
❤️ Health
<div id="health">100</div>
</div>

<div class="box">
⭐ Level
<div id="level">1</div>
</div>

<div class="box">
💰 Coins
<div id="coins">0</div>
</div>

<div class="box">
👾 Kills
<div id="kills">0</div>
</div>

</div>

<canvas id="gameCanvas"></canvas>

<div id="gameOver">

<h1>GAME OVER</h1>

<button onclick="location.reload()">
Play Again
</button>

</div>

<script src="game.js"></script>

</body>
</html>
